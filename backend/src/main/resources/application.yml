# Configuração comum a todos os perfis.
# Não há perfil padrão: execute com "dev" ou "prod" de forma explícita.
spring:
  application:
    name: FinanTrack
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

finantrack:
  zone-id: America/Sao_Paulo
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
  security:
    swagger-public: false
  cors:
    allowed-origins: []
