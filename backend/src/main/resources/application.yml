# Configuração comum a todos os perfis.
# Não há perfil padrão: execute com "dev" ou "prod" de forma explícita.
spring:
  application:
    name: FinanTrack
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  health:
    # Falha no SMTP não deve marcar a API como indisponível; o envio é assíncrono.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

finantrack:
  zone-id: America/Sao_Paulo
  frontend-url: ${FRONTEND_URL}
  tokens:
    email-verification-ttl: PT24H
    password-reset-ttl: PT30M
  mail:
    from: ${MAIL_FROM}
  rate-limit:
    ip-limit: 30
    email-limit: 10
    window: PT15M
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: PT15M
  refresh:
    ttl: P7D
    reuse-grace: PT10S
    cookie-secure: true
    cookie-same-site: Strict
  security:
    swagger-public: false
  cors:
    allowed-origins: []
