name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finantrack_test
          POSTGRES_USER: finantrack
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finantrack -d finantrack_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/finantrack_test
      DB_USERNAME: finantrack
      DB_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build FinanTrack.Web.sln -c Release

  images:
    name: Imagens de produção (build e teste de fumaça)
    runs-on: ubuntu-latest
    # Segredos gerados pelo próprio script de produção; o restante sobrepõe o
    # .env.prod só para o CI, e o banco é descartado no fim.
    env:
      FRONTEND_URL: http://localhost:8080
      MAIL_HOST: localhost
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@finantrack.local
    steps:
      - uses: actions/checkout@v7
      - name: Gera o .env.prod
        run: sh infra/generate-secrets.sh
      - name: Build e subida das imagens
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
      - name: Teste de fumaça
        run: sh infra/smoke-test.sh http://localhost:8080
      - name: Logs dos contêineres
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod logs --no-color
      - name: Derruba o ambiente
        if: always()
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod down -v

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: um segredo apagado num commit continua nos anteriores.
          fetch-depth: 0
      # Binário com versão fixa (e não a action): varre o histórico inteiro também em PRs.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --verbose --no-banner
